<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tes Sertifikasi Karyawan</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{--b:#D97757;--bg:#f7f5f3;--card:#fff;--tx:#1d1a18;--mu:#6f6862;--ln:#e5e0db;--bt:var(--b)}
.dark{--bg:#151211;--card:#201c1a;--tx:#f1ece8;--mu:#a49c95;--ln:#3a3330;--bt:color-mix(in srgb,var(--b) 50%,#fff)}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px}
.in{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:.55rem .7rem;color:var(--tx)}
.in:focus,.btn:focus-visible,.btn2:focus-visible{outline:2px solid var(--bt);outline-offset:1px}
.btn{background:var(--b);color:#fff;border-radius:8px;padding:.55rem .9rem;font-weight:600;border:1px solid color-mix(in srgb,var(--b) 65%,#fff)}
.btn2{border:1px solid var(--ln);border-radius:8px;padding:.4rem .7rem;color:var(--tx);background:var(--card)}
.mu{color:var(--mu)}.ac{color:var(--bt)}
.tab{padding:.55rem .8rem;border-bottom:2px solid transparent;color:var(--mu);white-space:nowrap}
.tab.on{color:var(--bt);border-color:var(--bt);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-size:.75rem;font-weight:600}
.ok{background:#15803d;color:#fff}.no{background:#b91c1c;color:#fff}
.chk{width:1.4rem;height:1.4rem;accent-color:var(--b);flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm text-white bg-black/85 hidden z-50"></div>
<script>
const API='https://wzcndcncyqkwoxoyrljf.supabase.co',KEY='sb_publishable_6nKlo9QMJOqBhDyApl_3cw_TFo-TJAY';
const OUTLETS=['Chatting 2 S.Parman','Chatting 3 Ampera','Chatting 4 Paris II','Chatting 5 Untan','Chatting 6 Tanray II','Chatting 7 Sumatra','Chatting 8 Karet','Jolie Sumatra','Zola Sulawesi'];
const COL={amber:['Amber/Emas','#F59E0B'],emerald:['Hijau/Emerald','#10B981'],sky:['Biru/Sky','#0EA5E9'],rose:['Merah/Rose','#F43F5E'],violet:['Ungu/Violet','#8B5CF6']};
const ERR={LOGIN_GAGAL:'Username atau password salah.',USERNAME_TERPAKAI:'Username sudah dipakai.',USERNAME_3_30_KARAKTER:'Username harus 3-30 karakter.',PASSWORD_MIN_4_KARAKTER:'Password minimal 4 karakter.',DATA_TIDAK_VALID:'Data tidak valid.',AKUN_DEVELOPER_TERKUNCI:'Akun Developer tidak bisa diubah/dihapus.',TIDAK_DIIZINKAN:'Tidak diizinkan.',NAMA_KOSONG:'Nama tidak boleh kosong.','Failed to fetch':'Tidak ada koneksi internet.'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const brand=o=>/^Jolie/.test(o)?'#4A2C2A':/^Zola/.test(o)?'#721C24':'#D97757';
const catL=c=>c==='leader'?'Leader Bar':'Reguler';
const errM=e=>ERR[e.message]||e.message||'Terjadi kesalahan.';
const chip=b=>{const h=(COL[b.c]||COL.amber)[1];return `<span class="pill" style="background:${h};color:${b.c==='amber'?'#1d1a18':'#fff'}">${esc(b.t)}</span>`};
const newForm=()=>({emp:'',manual:'',cat:null,checks:{},note:'',date:today()});
let S={me:ls.get('me'),data:null,hash:'',tab:'tes',outlet:OUTLETS[0],target:null,theme:ls.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),mode:'login',err:'',u:'',rdate:today(),form:newForm()};

async function rpc(fn,a){
  const r=await fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a||{})});
  const t=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((t.message||'').trim()||'Terjadi kesalahan.');
  return t;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2800)}
async function load(force){
  if(!S.me)return;
  try{
    const d=await rpc('sert_get_all',{p_token:S.me.token,p_target:S.target});
    const h=JSON.stringify(d);
    if(force||h!==S.hash){S.hash=h;S.data=d;render()}
  }catch(e){
    if(/SESI_TIDAK_VALID/.test(e.message))logout(true);
    else if(/AKUN_TIDAK_ADA/.test(e.message)){S.target=null;load(true)}
    else if(!S.data)toast(errM(e));
  }
}
async function act(fn,a){
  try{await rpc(fn,{p_token:S.me.token,...a});await load(true);return true}
  catch(e){toast(errM(e));return false}
}
const T=()=>({p_target:S.target});
function logout(silent){
  if(!silent&&S.me)rpc('sert_logout',{p_token:S.me.token}).catch(()=>{});
  S.me=null;S.data=null;S.hash='';S.target=null;ls.set('me',null);render();
}

/* ---------- Views ---------- */
function authV(){
  const reg=S.mode==='register';
  return `<div class="min-h-screen grid place-items-center p-4"><div class="card p-6 w-full max-w-sm">
  <h1 class="text-xl font-bold mb-1">Tes Sertifikasi Karyawan</h1>
  <p class="mu text-sm mb-4">${reg?'Buat akun penguji baru.':'Masuk sebagai penguji.'}</p>
  ${S.err?`<p class="text-sm mb-3" style="color:#dc2626">${esc(S.err)}</p>`:''}
  <label class="text-sm mu">Username</label><input id="u" class="in mb-3" autocomplete="username" value="${esc(S.u)}">
  <label class="text-sm mu">Password</label><input id="p" type="password" class="in mb-4" autocomplete="${reg?'new-password':'current-password'}">
  <button class="btn w-full" data-a="auth">${reg?'Daftar':'Masuk'}</button>
  <button class="w-full text-sm mt-3 ac" data-a="mode">${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button>
  </div></div>`;
}
function shell(){
  const d=S.data,dev=S.me.is_dev;
  const tabs=[['tes','Tes'],['rekap','Rekap & Unduh'],['poin','Poin Penilaian'],['kary','Karyawan']];
  if(dev)tabs.push(['akun','Akun']);
  const viewing=S.target&&S.target!==S.me.id;
  const body={tes:vTes,rekap:vRekap,poin:vPoin,kary:vKary,akun:vAkun}[S.tab]();
  return `<div class="max-w-2xl mx-auto p-3 pb-24">
  <header class="flex items-center justify-between py-2">
   <div><div class="font-bold text-lg">Tes Sertifikasi</div><div class="text-xs mu">${esc(S.me.username)}${dev?' (Developer)':''}</div></div>
   <div class="flex gap-2"><button class="btn2" data-a="theme">${S.theme==='dark'?'Mode Terang':'Mode Gelap'}</button><button class="btn2" data-a="logout">Keluar</button></div>
  </header>
  ${dev?`<div class="card p-3 mb-3"><label class="text-xs mu">Akun target (data yang dikelola)</label>
   <select class="in mt-1" data-c="target">${d.users.map(u=>`<option value="${u.id}" ${(S.target||S.me.id)===u.id?'selected':''}>${esc(u.username)}${u.is_dev?' (Developer)':''}</option>`).join('')}</select>
   ${viewing?`<p class="text-xs mt-2 ac">Anda sedang mengelola data milik ${esc(d.owner_name)}.</p>`:''}</div>`:''}
  <nav class="flex overflow-x-auto border-b mb-3" style="border-color:var(--ln)">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`).join('')}</nav>
  ${(S.tab==='tes'||S.tab==='kary')?`<select class="in mb-3" data-c="outlet" style="border-color:var(--b)">${OUTLETS.map(o=>`<option ${o===S.outlet?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}
  ${body()}</div>`;
}
function vTes(){
  const d=S.data,f=S.form,emps=d.employees.filter(e=>e.outlet===S.outlet);
  const man=f.emp==='__m',emp=emps.find(e=>e.id===f.emp);
  const cat=f.cat||(emp?emp.category:'reguler'),items=d.criteria[cat]||[];
  const sc=items.filter((_,i)=>f.checks[i]).length,tot=items.length,pct=tot?Math.round(sc*1000/tot)/10:0,pass=pct>=80;
  return `<div class="card p-4 space-y-3">
   <div><label class="text-sm mu">Tanggal</label><input type="date" class="in" data-c="fdate" value="${f.date}"></div>
   <div><label class="text-sm mu">Karyawan</label><select class="in" data-c="emp"><option value="">Pilih karyawan</option>
    ${emps.map(e=>`<option value="${e.id}" ${f.emp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}<option value="__m" ${man?'selected':''}>+ Input Manual</option></select></div>
   ${man?`<input class="in" data-i="manual" placeholder="Nama karyawan" value="${esc(f.manual)}">`:''}
   ${emp&&emp.badges.length?`<div class="flex flex-wrap gap-1">${emp.badges.map(chip).join('')}</div>`:''}
   <div class="flex gap-2">${['reguler','leader'].map(c=>`<button class="${cat===c?'btn':'btn2'} flex-1" data-a="fcat" data-v="${c}">${catL(c)}</button>`).join('')}</div>
   <p class="text-xs mu">Centang poin yang sudah sesuai standar.</p>
   <div class="space-y-1">${items.map((t,i)=>`<label class="flex gap-3 items-center py-2 border-b" style="border-color:var(--ln)"><input type="checkbox" class="chk" data-c="chk" data-i="${i}" ${f.checks[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')||'<p class="mu text-sm">Belum ada poin. Tambahkan di tab Poin Penilaian.</p>'}</div>
   <div class="flex items-center justify-between"><div class="text-2xl font-bold">${sc}/${tot} <span class="text-base mu">(${pct}%)</span></div><span class="pill ${pass?'ok':'no'}">${pass?'LULUS':'EVALUASI'}</span></div>
   <textarea class="in" rows="2" data-i="note" placeholder="Catatan penguji (opsional)">${esc(f.note)}</textarea>
   <button class="btn w-full" data-a="save">Simpan hasil tes</button></div>`;
}
function vRekap(){
  const rs=S.data.results.filter(r=>r.tested_on===S.rdate);
  const gs=OUTLETS.map(o=>[o,rs.filter(r=>r.outlet===o)]).filter(g=>g[1].length);
  const ps=rs.filter(r=>r.status==='LULUS').length;
  return `<div class="card p-4 mb-3 space-y-3"><input type="date" class="in" data-c="rdate" value="${S.rdate}">
   <p class="text-sm mu">${rs.length} hasil, ${ps} lulus, ${rs.length-ps} evaluasi</p>
   <div class="flex gap-2"><button class="btn flex-1" data-a="png">Unduh Laporan PNG</button><button class="btn2" data-a="delday">Hapus hari ini</button></div></div>
   ${gs.map(([o,a])=>`<div class="card p-3 mb-3" style="border-left:4px solid ${brand(o)}"><div class="font-semibold mb-2">${esc(o)}</div>
    ${a.map(r=>`<div class="py-2 border-t" style="border-color:var(--ln)"><div class="flex justify-between gap-2"><div><div class="font-medium">${esc(r.employee_name)}</div><div class="text-xs mu">${catL(r.category)}</div></div>
     <div class="text-right"><div class="font-semibold">${r.score}/${r.total} (${r.pct}%)</div><span class="pill ${r.status==='LULUS'?'ok':'no'}">${r.status}</span></div></div>
     ${r.badges.length?`<div class="flex flex-wrap gap-1 mt-1">${r.badges.map(chip).join('')}</div>`:''}
     ${r.note?`<p class="text-sm mu mt-1">${esc(r.note)}</p>`:''}
     <button class="text-xs mt-1" style="color:#dc2626" data-a="delres" data-id="${r.id}">Hapus</button></div>`).join('')}</div>`).join('')||'<p class="mu text-center py-8">Belum ada hasil tes di tanggal ini.</p>'}`;
}
function vPoin(){
  return ['reguler','leader'].map(c=>{const a=S.data.criteria[c];return `<div class="card p-4 mb-3"><div class="font-semibold mb-2">Poin ${catL(c)} (${a.length})</div>
   ${a.map((t,i)=>`<div class="flex gap-1 items-center mb-2"><input class="in" data-c="crit" data-cat="${c}" data-i="${i}" value="${esc(t)}">
    <button class="btn2" data-a="cmove" data-cat="${c}" data-i="${i}" data-d="-1" aria-label="Naik" ${i===0?'disabled':''}>↑</button>
    <button class="btn2" data-a="cmove" data-cat="${c}" data-i="${i}" data-d="1" aria-label="Turun" ${i===a.length-1?'disabled':''}>↓</button>
    <button class="btn2" style="color:#dc2626" data-a="cdel" data-cat="${c}" data-i="${i}" aria-label="Hapus">✕</button></div>`).join('')}
   <div class="flex gap-2 mt-3"><input class="in" id="new-${c}" placeholder="Poin baru"><button class="btn" data-a="cadd" data-cat="${c}">Tambah</button></div></div>`}).join('');
}
function vKary(){
  const es=S.data.employees.filter(e=>e.outlet===S.outlet);
  return `<div class="card p-4 mb-3"><div class="font-semibold mb-2">Tambah karyawan</div>
   <div class="flex gap-2"><input class="in" id="enew" placeholder="Nama karyawan"><select class="in" id="ecat" style="width:9rem"><option value="reguler">Reguler</option><option value="leader">Leader Bar</option></select></div>
   <button class="btn w-full mt-2" data-a="eadd">Tambah</button></div>
   ${es.map(e=>`<div class="card p-3 mb-3"><div class="flex gap-2 mb-2"><input class="in" data-c="ename" data-id="${e.id}" value="${esc(e.name)}">
    <button class="btn2" style="color:#dc2626" data-a="edel" data-id="${e.id}">Hapus</button></div>
    <div class="flex gap-2 mb-2">${['reguler','leader'].map(c=>`<button class="${e.category===c?'btn':'btn2'} flex-1" data-a="ecat" data-id="${e.id}" data-v="${c}">${catL(c)}</button>`).join('')}</div>
    ${e.badges.map((b,i)=>`<div class="flex gap-2 items-center mb-2">${chip(b)}<input class="in" data-c="bt" data-id="${e.id}" data-i="${i}" value="${esc(b.t)}">
     <select class="in" style="width:9rem" data-c="bc" data-id="${e.id}" data-i="${i}">${Object.entries(COL).map(([k,v])=>`<option value="${k}" ${b.c===k?'selected':''}>${v[0]}</option>`).join('')}</select>
     <button class="btn2" style="color:#dc2626" data-a="bdel" data-id="${e.id}" data-i="${i}" aria-label="Hapus badge">✕</button></div>`).join('')}
    <button class="btn2 text-sm" data-a="badd" data-id="${e.id}">+ Badge</button></div>`).join('')||'<p class="mu text-center py-8">Belum ada karyawan di outlet ini.</p>'}`;
}
function vAkun(){
  return `<div class="card p-4 mb-3"><div class="font-semibold mb-2">Buat akun penguji</div>
   <div class="flex gap-2"><input class="in" id="nu" placeholder="Username"><input class="in" id="np" placeholder="Password"></div>
   <button class="btn w-full mt-2" data-a="acreate">Buat akun</button></div>
   ${S.data.users.map(u=>`<div class="card p-3 mb-2"><div class="font-medium mb-2">${esc(u.username)}${u.is_dev?' (Developer)':''}</div>
    <div class="flex flex-wrap gap-2"><button class="btn2" data-a="akelola" data-id="${u.id}">Kelola data</button>
    ${u.is_dev?'':`<button class="btn2" data-a="aname" data-id="${u.id}" data-n="${esc(u.username)}">Ubah nama</button>`}
    <button class="btn2" data-a="apass" data-id="${u.id}">Ubah password</button>
    ${u.is_dev?'':`<button class="btn2" style="color:#dc2626" data-a="adel" data-id="${u.id}" data-n="${esc(u.username)}">Hapus</button>`}</div></div>`).join('')}`;
}
function render(){
  const y=scrollY;
  document.documentElement.classList.toggle('dark',S.theme==='dark');
  document.documentElement.style.setProperty('--b',brand(S.outlet));
  $('#app').innerHTML=S.me?(S.data?shell():'<p class="p-6 mu">Memuat data…</p>'):authV();
  scrollTo(0,y);
}

/* ---------- Laporan PNG (canvas high-DPI) ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fit(x,t,w){if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function png(){
  const rs=S.data.results.filter(r=>r.tested_on===S.rdate);
  if(!rs.length)return toast('Belum ada hasil di tanggal ini.');
  const gs=OUTLETS.map(o=>[o,rs.filter(r=>r.outlet===o)]).filter(g=>g[1].length);
  const W=900,P=32,sc=3,hh=40,rh=r=>58+(r.note?20:0);
  let H=140;gs.forEach(([,a])=>{H+=hh+a.reduce((s,r)=>s+rh(r),0)+20});
  const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;
  const x=c.getContext('2d');x.scale(sc,sc);
  const F='system-ui,-apple-system,"Segoe UI",sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#1d1a18';x.font=`700 28px ${F}`;x.fillText('Laporan Tes Sertifikasi',P,56);
  x.fillStyle='#6f6862';x.font=`400 16px ${F}`;
  x.fillText(`${fmtDate(S.rdate)} - Penguji: ${S.data.owner_name}`,P,86);
  const ps=rs.filter(r=>r.status==='LULUS').length;
  x.fillText(`Total ${rs.length} karyawan: ${ps} lulus, ${rs.length-ps} evaluasi`,P,110);
  let y=134;
  gs.forEach(([o,a])=>{
    x.fillStyle=brand(o);rr(x,P,y,W-2*P,hh,8);x.fill();
    x.fillStyle='#fff';x.font=`700 17px ${F}`;x.fillText(o,P+14,y+26);y+=hh;
    a.forEach(r=>{
      x.fillStyle='#1d1a18';x.font=`600 16px ${F}`;x.fillText(fit(x,r.employee_name,520),P+6,y+26);
      x.fillStyle='#6f6862';x.font=`400 13px ${F}`;x.fillText(catL(r.category),P+6,y+46);
      let bx=P+6+x.measureText(catL(r.category)).width+12;
      r.badges.forEach(b=>{
        x.font=`600 12px ${F}`;const w=x.measureText(b.t).width+16;
        x.fillStyle=(COL[b.c]||COL.amber)[1];rr(x,bx,y+34,w,17,8.5);x.fill();
        x.fillStyle=b.c==='amber'?'#1d1a18':'#fff';x.fillText(b.t,bx+8,y+47);bx+=w+6;
      });
      x.textAlign='right';x.fillStyle='#1d1a18';x.font=`700 16px ${F}`;x.fillText(`${r.score}/${r.total} (${r.pct}%)`,W-P-6,y+26);
      x.fillStyle=r.status==='LULUS'?'#15803d':'#b91c1c';x.font=`700 14px ${F}`;x.fillText(r.status,W-P-6,y+46);
      x.textAlign='left';
      if(r.note){x.fillStyle='#6f6862';x.font=`italic 13px ${F}`;x.fillText(fit(x,'Catatan: '+r.note,W-2*P-12),P+6,y+68)}
      y+=rh(r);x.fillStyle='#e5e0db';x.fillRect(P,y-4,W-2*P,1);
    });
    y+=20;
  });
  c.toBlob(b=>{const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`laporan-sertifikasi-${S.rdate}.png`;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),5e3)});
}

/* ---------- Events ---------- */
const emp$=id=>S.data.employees.find(e=>e.id===id);
const saveEmp=(e,ch)=>{const n={...e,...ch};return act('sert_upsert_employee',{...T(),p_id:n.id,p_outlet:n.outlet,p_name:n.name,p_category:n.category,p_badges:n.badges})};
const setCrit=(c,arr)=>{S.data.criteria[c]=arr;render();return act('sert_set_criteria',{...T(),p_category:c,p_items:arr})};
const A={
  mode(){S.mode=S.mode==='login'?'register':'login';S.err='';render()},
  async auth(){
    const u=$('#u').value,p=$('#p').value;S.u=u;S.err='';
    try{const r=await rpc(S.mode==='register'?'sert_register':'sert_login',{p_username:u,p_password:p});
      S.me={token:r.token,id:r.id,username:r.username,is_dev:r.is_dev};ls.set('me',S.me);S.u='';await load(true)}
    catch(e){S.err=errM(e);render()}
  },
  theme(){S.theme=S.theme==='dark'?'light':'dark';ls.set('theme',S.theme);render()},
  logout(){logout()},
  tab(el){S.tab=el.dataset.t;render()},
  fcat(el){S.form.cat=el.dataset.v;S.form.checks={};render()},
  async save(){
    const d=S.data,f=S.form,man=f.emp==='__m',emp=emp$(f.emp);
    const name=man?f.manual.trim():emp?emp.name:'';
    if(!name)return toast('Pilih karyawan atau isi nama manual.');
    const cat=f.cat||(emp?emp.category:'reguler'),items=d.criteria[cat]||[];
    if(!items.length)return toast('Belum ada poin penilaian.');
    const score=items.filter((_,i)=>f.checks[i]).length;
    const ok=await act('sert_save_result',{...T(),p_data:{tested_on:f.date,outlet:S.outlet,employee_name:name,category:cat,badges:emp?emp.badges:[],scores:items.map((t,i)=>({t,ok:!!f.checks[i]})),score,total:items.length,note:f.note}});
    if(ok){S.form={...newForm(),date:f.date};S.rdate=f.date;render();toast('Hasil tes disimpan.')}
  },
  async delres(el){if(confirm('Hapus hasil tes ini?'))act('sert_delete_results',{...T(),p_ids:[el.dataset.id]})},
  async delday(){
    const ids=S.data.results.filter(r=>r.tested_on===S.rdate).map(r=>r.id);
    if(ids.length&&confirm(`Hapus ${ids.length} hasil pada ${fmtDate(S.rdate)}?`))act('sert_delete_results',{...T(),p_ids:ids});
  },
  png,
  cmove(el){const{cat,i,d}=el.dataset,a=[...S.data.criteria[cat]],j=+i+ +d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setCrit(cat,a)},
  cdel(el){const{cat,i}=el.dataset;if(!confirm('Hapus poin ini?'))return;const a=[...S.data.criteria[cat]];a.splice(+i,1);setCrit(cat,a)},
  cadd(el){const c=el.dataset.cat,v=$('#new-'+c).value.trim();if(v)setCrit(c,[...S.data.criteria[c],v])},
  eadd(){const n=$('#enew').value.trim();if(!n)return toast('Isi nama karyawan.');act('sert_upsert_employee',{...T(),p_id:null,p_outlet:S.outlet,p_name:n,p_category:$('#ecat').value,p_badges:[]})},
  edel(el){const e=emp$(el.dataset.id);if(confirm(`Hapus karyawan ${e.name}?`))act('sert_delete_employee',{...T(),p_id:e.id})},
  ecat(el){const e=emp$(el.dataset.id);if(e.category!==el.dataset.v)saveEmp(e,{category:el.dataset.v})},
  badd(el){const e=emp$(el.dataset.id);saveEmp(e,{badges:[...e.badges,{t:'Badge baru',c:'amber'}]})},
  bdel(el){const e=emp$(el.dataset.id),b=[...e.badges];b.splice(+el.dataset.i,1);saveEmp(e,{badges:b})},
  acreate(){act('sert_admin_create',{p_username:$('#nu').value,p_password:$('#np').value}).then(ok=>ok&&toast('Akun dibuat.'))},
  akelola(el){S.target=el.dataset.id===S.me.id?null:el.dataset.id;S.form=newForm();S.tab='poin';load(true)},
  aname(el){const n=prompt('Username baru untuk '+el.dataset.n+':',el.dataset.n);if(n&&n!==el.dataset.n)act('sert_admin_rename',{p_id:el.dataset.id,p_new:n}).then(ok=>ok&&toast('Nama diubah. Riwayat ikut pindah.'))},
  apass(el){const n=prompt('Password baru (min. 4 karakter):');if(n)act('sert_admin_password',{p_id:el.dataset.id,p_new:n}).then(ok=>ok&&toast('Password diubah.'))},
  adel(el){if(confirm(`Hapus akun ${el.dataset.n} beserta seluruh datanya?`))act('sert_admin_delete',{p_id:el.dataset.id}).then(()=>{if(S.target===el.dataset.id){S.target=null;load(true)}})},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.me&&(e.target.id==='u'||e.target.id==='p'))A.auth()});
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(e.target.dataset.i&&(i==='manual'||i==='note'))S.form[i]=e.target.value});
document.addEventListener('change',e=>{
  const el=e.target,c=el.dataset.c;if(!c)return;
  const f=S.form,v=el.value;
  if(c==='outlet'){S.outlet=v;S.form={...newForm(),date:f.date};render()}
  else if(c==='fdate'){f.date=v;render()}
  else if(c==='emp'){f.emp=v;f.cat=null;f.checks={};render()}
  else if(c==='chk'){f.checks[el.dataset.i]=el.checked;render()}
  else if(c==='rdate'){S.rdate=v||today();render()}
  else if(c==='target'){S.target=v===S.me.id?null:v;S.form=newForm();load(true)}
  else if(c==='crit'){const a=[...S.data.criteria[el.dataset.cat]];if(!v.trim())return render();a[+el.dataset.i]=v.trim();setCrit(el.dataset.cat,a)}
  else if(c==='ename'){const e=emp$(el.dataset.id);if(v.trim())saveEmp(e,{name:v.trim()});else render()}
  else if(c==='bt'||c==='bc'){const e=emp$(el.dataset.id),b=e.badges.map(x=>({...x}));b[+el.dataset.i][c==='bt'?'t':'c']=v.trim()||b[+el.dataset.i].t;saveEmp(e,{badges:b})}
});

/* ---------- Sinkronisasi otomatis lintas perangkat ---------- */
setInterval(()=>{if(document.hidden||!S.me)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;load()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
addEventListener('online',()=>load());
render();load(true);
</script>
</body>
</html>
